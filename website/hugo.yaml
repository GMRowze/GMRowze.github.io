baseURL: "https://gmrowze.github.io/"
title: Rowze's Archive
contentDir: ../published
staticDir: [../files, static]

######################## Base Config ########################
enableGitInfo: true
enableEmoji: true
module:
  imports:
    - path: github.com/imfing/hextra
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
######################### Languages #########################
defaultContentLanguage: en
languages:
  en:
    languageName: English
    weight: 1


########################### Menu ############################
menu:
  main:
    - identifier: about
      name: Home
      pageRef: /
      weight: 1
    - identifier: books
      name: Books
      pageRef: /books
      weight: 2
    - identifier: wiki
      name: Wiki
      pageRef: /wiki
      weight: 3
    - identifier: community
      name: Community
      pageRef: /community
      weight: 4
    - identifier: blog
      name: Blog
      pageRef: /blog
      weight: 5
    - identifier: search
      name: Search
      weight: 6
      params:
        type: search
    - identifier: theme-toggle
      name: Theme Toggle
      params:
        type: theme-toggle
        label: true
    - identifier: language-switch
      name: Language Switcher
      params:
        type: language-switch
        label: true 
        icon: "globe-alt"

########################## Params ###########################
params:
  writing:
    githubUser: ""
    showExternal: false
    activityIcon: pencil-alt
  externalLinkDecoration: true
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"
  theme:
    default: light
    displayToggle: false
  navbar:
    displayTitle: true
    displayLogo: 
    logo:
      path: logo.svg
      dark: logo-dark.svg
      width: 24
      height: 24
  footer:
    displayCopyright: true
    displayPoweredBy: false
  editURL:
    enable: false
    base: "https://github.com/GMRowze/GMRowze.github.io/edit/main/content"
  blog:
    list:
      displayTags: true
      sortBy: date
      sortOrder: desc
      pagerSize: 20
    article:
      displayPagination: true
  toc:
    displayTags: true
  highlight:
    copy:
      enable: true
      display: hover
